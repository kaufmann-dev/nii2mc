[package]
name = "nii2mc"
version = "0.1.0"
edition = "2024"
description = "Round-trip discrete NIfTI label maps through Minecraft Java worlds"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fastanvil = "0.32"
fastnbt = "2.6"
flate2 = "1.1"
fs2 = "0.4"
quick-xml = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = "symbols"

